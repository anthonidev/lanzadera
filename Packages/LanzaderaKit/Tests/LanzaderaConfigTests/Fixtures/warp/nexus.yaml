# Warp Launch Configuration
#
#
# Use this to start a certain configuration of windows, tabs, and panes.
# Open the launch configuration palette to access and open any launch configuration.
#
# This file defines your launch configuration.
# More on how to do so here:
# https://docs.warp.dev/terminal/sessions/launch-configurations
#
# All launch configurations are stored under ~/.warp/launch_configurations.
# Edit them anytime!
#
# You can also add commands that run on-start for your launch configurations like so:
# ---
# name: Example with Command
# windows:
#  - tabs:
#      - layout:
#          cwd: /Users/warp-user/project
#          commands:
#            - exec: code .
---
name: Nexus
active_window_index: 1
windows:
  - active_tab_index: 0
    tabs:
      - layout:
          split_direction: horizontal
          panes:
            - cwd: /Users/tonis/Desktop/data/fotos
              is_focused: true
              pane_mode: terminal
            - cwd: /Users/tonis/Desktop/data/fotos
              pane_mode: terminal
  - active_tab_index: 2
    tabs:
      - title: BACKEND
        layout:
          split_direction: horizontal
          panes:
            - cwd: /Users/tonis/nexus/nexus-backend
              pane_mode: terminal
            - cwd: /Users/tonis/nexus/nexus-backend
              is_focused: true
              pane_mode: terminal
            - cwd: /Users/tonis/nexus/nexus-backend
              pane_mode: terminal
        color: red
      - title: FRONTEND
        layout:
          split_direction: horizontal
          panes:
            - cwd: /Users/tonis/nexus/nexus-frontend
              pane_mode: terminal
            - cwd: /Users/tonis/nexus/nexus-frontend
              is_focused: true
              pane_mode: terminal
        color: red
      - title: GLOBAL
        layout:
          cwd: /Users/tonis/nexus
          is_focused: true
          pane_mode: terminal
        color: red
