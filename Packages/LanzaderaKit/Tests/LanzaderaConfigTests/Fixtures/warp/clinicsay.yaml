# Warp Launch Configuration
#
#
# Use this to start a certain configuration of windows, tabs, and panes.
# Open the launch configuration palette to access and open any launch configuration.
#
# This file defines your launch configuration.
# More on how to do so here:
# https://docs.warp.dev/terminal/sessions/launch-configurations
#
# All launch configurations are stored under ~/.warp/launch_configurations.
# Edit them anytime!
#
# You can also add commands that run on-start for your launch configurations like so:
# ---
# name: Example with Command
# windows:
#  - tabs:
#      - layout:
#          cwd: /Users/warp-user/project
#          commands:
#            - exec: code .

---
name: Clinicsay
active_window_index: 0
windows:
  - active_tab_index: 0
    tabs:
      - title: MIGRATION APP
        layout:
          cwd: /Users/tonis/clinicsay/migration-app
          is_focused: true
          pane_mode: terminal
        color: magenta
      - title: BACKEND
        layout:
          cwd: /Users/tonis/clinicsay/clinicsay-backend
          is_focused: true
          pane_mode: terminal
        color: red
      - title: FRONTEND
        layout:
          cwd: /Users/tonis/clinicsay/clinicsay-frontend
          is_focused: true
          pane_mode: terminal
        color: blue
